name: leetcode-nag

# GitHub Actions cron only speaks UTC and ignores daylight saving, so instead
# of guessing the right UTC hour this runs hourly and skips the 23 runs that
# aren't your nag hour. Change the hour in config.yml, not here.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now, ignoring the nag-hour gate"
        type: boolean
        default: true

jobs:
  nag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # to commit state.json back after a send
    steps:
      - uses: actions/checkout@v5

      # Cheap pre-check so 23 of 24 daily runs cost ~5s instead of ~40s.
      # nag.py re-checks properly; if this can't read config.yml it lets the
      # run continue and defers to that.
      - name: Hour gate
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — skipping the gate."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tz=$(sed -n 's/^[[:space:]]*timezone:[[:space:]]*//p' config.yml | head -1 | tr -d "\"' ")
          want=$(sed -n 's/^[[:space:]]*nag_hour:[[:space:]]*//p' config.yml | head -1 | tr -dc '0-9')
          if [ -z "$tz" ] || [ -z "$want" ]; then
            echo "Couldn't read timezone/nag_hour from config.yml — letting nag.py decide."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Without a tz database, `TZ=` is ignored and date silently returns
          # UTC — which would gate on the wrong hour. Defer to nag.py instead.
          if [ ! -e "/usr/share/zoneinfo/$tz" ]; then
            echo "No tz database entry for $tz — letting nag.py decide."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(TZ="$tz" date +%H)
          if [ "$((10#$now))" -eq "$((10#$want))" ]; then
            echo "It's ${now}:00 in ${tz}. Go."
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "It's ${now}:00 in ${tz}, nag hour is ${want}:00. Skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.go == 'true'

      - name: Run the nagger
        if: steps.gate.outputs.go == 'true'
        run: python nag.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Discord
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          # Email
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          # SMS
          SMS_TO: ${{ secrets.SMS_TO }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}

      # Runs even if the send partly failed, so a successful channel still
      # records its state and doesn't re-fire tomorrow's message twice.
      - name: Persist state.json
        if: always() && steps.gate.outputs.go == 'true'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "leetcode-nagger[bot]"
            git config user.email "leetcode-nagger@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update nagger state"
            git push
          else
            echo "state.json unchanged"
          fi
