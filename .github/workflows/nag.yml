name: leetcode-nag

# GitHub Actions cron is UTC-only and ignores DST. To pin the nag to 7pm
# America/New_York year-round, we fire at BOTH possible UTC times (one for
# EDT, one for EST) and a gate step exits early in the wrong season.
#
# Blind 75 finished 2026-08-06 — daily nag disabled. Uncomment the schedule
# block to turn it back on; workflow_dispatch still works for manual runs.
on:
  # schedule:
  #   - cron: "0 23 * * *"   # 7pm EDT (Mar–Nov, daylight saving)
  #   - cron: "0 0  * * *"   # 7pm EST (Nov–Mar, standard time)
  workflow_dispatch: {}

jobs:
  nag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # needed to commit state.json after a congrats send
    steps:
      - name: Gate on 7pm America/New_York
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — skipping time gate."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=America/New_York date +%H)
          if [ "$hour" = "19" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Local hour is $hour (not 19) — wrong season for this cron, skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.go == 'true'

      - run: python nag.py
        if: steps.gate.outputs.go == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: ${{ secrets.SHEET_TAB }}
          SCHEDULE_TAB: ${{ secrets.SCHEDULE_TAB }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

      - name: Persist state.json
        if: steps.gate.outputs.go == 'true'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "leetcode-nagger[bot]"
            git config user.email "leetcode-nagger@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update congrats state"
            git push
          else
            echo "state.json unchanged"
          fi
